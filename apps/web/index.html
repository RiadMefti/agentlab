<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f8fafc" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self'; script-src 'self' 'sha256-FaadOS/ut4JljED7Nj9xBWIUcc6tIq0LKgILvNLpTPU='; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:* ws://localhost:*"
    />
    <script id="theme-bootstrap">
      (() => {
        const name = "ao-appearance";
        const part = document.cookie
          .split(";")
          .map((value) => value.trim())
          .find((value) => value.startsWith(`${name}=`));
        const stored = part === undefined ? "" : part.slice(name.length + 1);
        const appearance = ["system", "light", "dark"].includes(stored) ? stored : "system";
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = appearance === "system" ? (systemDark ? "dark" : "light") : appearance;
        document.documentElement.dataset.appearance = appearance;
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", theme);
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#15191e" : "#f8fafc");
      })();
    </script>
    <title>Orchestrator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
