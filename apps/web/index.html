<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f8fafc" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self'; script-src 'self' 'sha256-6OQXq9GB0y62Kr442xOuhKNtbpVkvkTeKKQMHjlck1M='; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:* ws://localhost:*"
    />
    <script id="theme-bootstrap">
      (() => {
        const name = "ao-appearance";
        const part = document.cookie
          .split(";")
          .map((value) => value.trim())
          .find((value) => value.startsWith(`${name}=`));
        const stored = part === undefined ? "" : part.slice(name.length + 1);
        const themes = {
          light: ["light", "#f8fafc"],
          "solarized-light": ["light", "#fdf6e3"],
          dark: ["dark", "#15191e"],
          "tokyo-night": ["dark", "#16161e"]
        };
        const appearance = stored === "system" || Object.hasOwn(themes, stored) ? stored : "system";
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = appearance === "system" ? (systemDark ? "dark" : "light") : appearance;
        document.documentElement.dataset.appearance = appearance;
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="color-scheme"]')
          ?.setAttribute("content", themes[theme][0]);
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", themes[theme][1]);
      })();
    </script>
    <title>Orchestrator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
