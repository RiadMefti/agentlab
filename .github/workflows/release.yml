name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.0"
  NODE_VERSION: "24"

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install terminal runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tmux
          npm install --global "bun@${BUN_VERSION}"
      - name: Install locked dependencies
        run: npm ci
      - name: Validate tag and release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          npm run release:check -- "$GITHUB_REF_NAME"
          if [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != "tag" ]]; then
            echo "Release tags must be annotated." >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "refs/tags/$GITHUB_REF_NAME")"
          if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "The checked-out commit does not match the release tag." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tags must point to a commit already present on origin/main." >&2
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Run the full verification suite
        run: npm run verify
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  linux:
    name: Linux x64
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Bun
        run: npm install --global "bun@${BUN_VERSION}"
      - name: Install locked dependencies
        run: npm ci
      - name: Build and smoke-test the executable
        run: npm run package
      - name: Verify the executable architecture
        run:
          file release/agent-orchestrator-v${{ needs.validate.outputs.version }}-linux-x64 | grep -F
          "x86-64"
      - name: Upload the Linux executable and target-specific SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x64
          path: |
            release/agent-orchestrator-v${{ needs.validate.outputs.version }}-linux-x64
            release/agent-orchestrator-v${{ needs.validate.outputs.version }}-linux-x64.cdx.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  macos:
    name: macOS Apple silicon
    needs: validate
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Verify the runner architecture
        run: test "$(uname -m)" = "arm64"
      - name: Install Bun
        run: npm install --global "bun@${BUN_VERSION}"
      - name: Install locked dependencies
        run: npm ci
      - name: Build and smoke-test the executable
        run: npm run package
      - name: Verify the executable architecture
        run:
          file release/agent-orchestrator-v${{ needs.validate.outputs.version }}-mac-arm64 | grep -F
          "arm64"
      - name: Upload the macOS executable and target-specific SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-arm64
          path: |
            release/agent-orchestrator-v${{ needs.validate.outputs.version }}-mac-arm64
            release/agent-orchestrator-v${{ needs.validate.outputs.version }}-mac-arm64.cdx.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish immutable GitHub Release
    needs: [validate, linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download all release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Validate the complete asset set
        run: node scripts/check-release-assets.mjs "$GITHUB_REF_NAME" release-assets
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum agent-orchestrator-* > SHA256SUMS
          sha256sum --check SHA256SUMS
          cd ..
          node scripts/check-release-assets.mjs "$GITHUB_REF_NAME" release-assets --published
      - name: Inspect any existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if existing_is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$existing_is_draft" == "true" ]]; then
              echo "state=draft" >> "$GITHUB_OUTPUT"
            elif [[ "$existing_is_draft" == "false" ]]; then
              echo "state=published" >> "$GITHUB_OUTPUT"
            else
              echo "GitHub returned an invalid release state." >&2
              exit 1
            fi
          else
            echo "state=missing" >> "$GITHUB_OUTPUT"
          fi
      - name: Attest build provenance
        if: steps.existing.outputs.state != 'published'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/agent-orchestrator-v${{ needs.validate.outputs.version }}-linux-x64
            release-assets/agent-orchestrator-v${{ needs.validate.outputs.version }}-linux-x64.cdx.json
            release-assets/agent-orchestrator-v${{ needs.validate.outputs.version }}-mac-arm64
            release-assets/agent-orchestrator-v${{ needs.validate.outputs.version }}-mac-arm64.cdx.json
            release-assets/SHA256SUMS
      - name: Attest the Linux bundle SBOM
        if: steps.existing.outputs.state != 'published'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path:
            release-assets/agent-orchestrator-v${{ needs.validate.outputs.version }}-linux-x64
          sbom-path:
            release-assets/agent-orchestrator-v${{ needs.validate.outputs.version
            }}-linux-x64.cdx.json
      - name: Attest the macOS bundle SBOM
        if: steps.existing.outputs.state != 'published'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path:
            release-assets/agent-orchestrator-v${{ needs.validate.outputs.version }}-mac-arm64
          sbom-path:
            release-assets/agent-orchestrator-v${{ needs.validate.outputs.version
            }}-mac-arm64.cdx.json
      - name: Replace an incomplete draft
        if: steps.existing.outputs.state == 'draft'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$GITHUB_REF_NAME" --yes
      - name: Create the complete draft release
        if: steps.existing.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_notice=$'Requires tmux. Download the executable for your platform, run `chmod +x agent-orchestrator-*`, and place it on your PATH. The macOS executable is not notarized; after verifying its checksum and attestation, run `xattr -d com.apple.quarantine agent-orchestrator-v${{ needs.validate.outputs.version }}-mac-arm64` if Gatekeeper blocks it.'
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --draft \
            --fail-on-no-commits \
            --generate-notes \
            --notes "$release_notice" \
            --title "Agent Orchestrator ${{ needs.validate.outputs.version }}" \
            --verify-tag
      - name: Verify draft assets against local digests
        if: steps.existing.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/draft-release.json"
          gh release view "$GITHUB_REF_NAME" --json isDraft,assets > "$release_json"
          jq -e '.isDraft == true' "$release_json" >/dev/null
          local_names="$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)"
          remote_names="$(jq -r '.assets[].name' "$release_json" | sort)"
          test "$local_names" = "$remote_names"
          while read -r digest filename; do
            remote_digest="$(jq -r --arg name "$filename" '.assets[] | select(.name == $name) | .digest // empty' "$release_json")"
            test "$remote_digest" = "sha256:$digest"
          done < <(cd release-assets && sha256sum *)
      - name: Publish the release
        if: steps.existing.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: Verify the published release
        env:
          EXISTING_RELEASE_STATE: ${{ steps.existing.outputs.state }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/published-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > "$release_json"
          jq -e '.draft == false and .prerelease == false' "$release_json" >/dev/null
          if [[ "$EXISTING_RELEASE_STATE" == "published" ]]; then
            download_directory="$RUNNER_TEMP/published-release-assets"
            mkdir -p "$download_directory"
            gh release download "$GITHUB_REF_NAME" --dir "$download_directory"
            node scripts/check-release-assets.mjs "$GITHUB_REF_NAME" "$download_directory" --published
            for asset in "$download_directory"/agent-orchestrator-* "$download_directory"/SHA256SUMS; do
              gh attestation verify "$asset" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-digest "$GITHUB_SHA" \
                --source-ref "$GITHUB_REF" \
                --deny-self-hosted-runners
            done
          else
            local_names="$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)"
            remote_names="$(jq -r '.assets[].name' "$release_json" | sort)"
            test "$local_names" = "$remote_names"
            while read -r digest filename; do
              remote_digest="$(jq -r --arg name "$filename" '.assets[] | select(.name == $name) | .digest // empty' "$release_json")"
              test "$remote_digest" = "sha256:$digest"
            done < <(cd release-assets && sha256sum *)
          fi
