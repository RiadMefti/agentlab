name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.0"
  NODE_VERSION: "24"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install terminal runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tmux
          npm install --global "bun@${BUN_VERSION}"
      - run: npm ci
      - name: Validate release metadata
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          npm run release:check -- "v$version"
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=high

  package_macos:
    name: package-macos
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Verify the runner architecture
        run: test "$(uname -m)" = "arm64"
      - name: Install Bun
        run: npm install --global "bun@${BUN_VERSION}"
      - run: npm ci
      - name: Build and smoke-test the executable
        run: npm run package
      - name: Verify the executable architecture
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          file "release/agentlab-v${version}-mac-arm64" | grep -F "arm64"
