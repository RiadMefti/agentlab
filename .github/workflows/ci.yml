name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.0"
  NODE_VERSION: "24"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install terminal runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tmux
          npm install --global "bun@${BUN_VERSION}"
      - run: npm ci
      - name: Validate release metadata
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          npm run release:check -- "v$version"
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=high

  factory_sandbox:
    name: factory-sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install isolation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap dbus-user-session python3 uidmap
      - name: Permit unprivileged Bubblewrap namespaces on the ephemeral runner
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - name: Provision subordinate IDs for the cross-account proof on the ephemeral runner
        shell: bash
        run: |
          ensure_subordinate_range() {
            local mapping_file="$1" mapping_option="$2" range_start range_end
            if awk -F: -v principal="$USER" '$1 == principal && $3 >= 65536 { found = 1 } END { exit !found }' "$mapping_file"; then
              return
            fi
            range_start="$(awk -F: 'BEGIN { next_id = 100000 } $2 + $3 > next_id { next_id = $2 + $3 } END { printf "%.0f", next_id }' "$mapping_file")"
            range_end="$((range_start + 65535))"
            test "$range_end" -lt 4294967294
            sudo usermod "$mapping_option" "${range_start}-${range_end}" "$USER"
          }
          ensure_subordinate_range /etc/subuid --add-subuids
          ensure_subordinate_range /etc/subgid --add-subgids
      - run: npm ci
      - name: Start the unprivileged user manager and run live isolation tests
        shell: bash
        run: |
          user_id="$(id -u)"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@${user_id}.service"
          export XDG_RUNTIME_DIR="/run/user/${user_id}"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
          systemd-run --user --scope --quiet /usr/bin/true
          npm run test:factory-sandbox
      - name: Prove authenticated cross-account ledger reads and private storage isolation
        run: npm run test:factory-role-isolation

  package_macos:
    name: package-macos
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Verify the runner architecture
        run: test "$(uname -m)" = "arm64"
      - name: Install terminal runtime dependencies
        run: |
          brew install tmux
          npm install --global "bun@${BUN_VERSION}"
      - run: npm ci
      - name: Build and smoke-test the executable
        run: npm run package
      - name: Verify the executable architecture
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          file "release/agentlab-v${version}-mac-arm64" | grep -F "arm64"
